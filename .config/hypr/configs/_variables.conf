# Shared variables - loaded first

# Path variables
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/configs

# Modifier
$mainMod = SUPER

# Default apps
$editor = ${EDITOR:-nvim}
$term = kitty
$files = kitty -e yazi
$browser = firefox

# URLs
$searchEngine = "https://www.google.com/search?q={}"

# Wallpaper
$wallDIR = $HOME/Pictures/wallpapers

# Hardware (laptop-specific)
$touchpadDevice = asup1205:00-093a:2008-touchpad
$touchpadEnabled = true
