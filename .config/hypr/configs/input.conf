# Input configuration

input {
  kb_layout = us
  kb_variant =
  kb_model =
  kb_options =
  kb_rules =
  repeat_rate = 50
  repeat_delay = 300

  sensitivity = 0
  numlock_by_default = true
  left_handed = false
  follow_mouse = 1
  float_switch_override_focus = false

  touchpad {
    disable_while_typing = true
    natural_scroll = true
    clickfinger_behavior = false
    middle_button_emulation = false
    tap-to-click = true
    drag_lock = false
  }

  touchdevice {
    enabled = true
  }

  tablet {
    transform = 0
    left_handed = 0
  }
}

# Touchpad device configuration
device {
  name = $touchpadDevice
  enabled = $touchpadEnabled
}
