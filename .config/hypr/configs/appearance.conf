# Appearance configuration (visual properties)

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  gaps_in = 6
  gaps_out = 12

  col.active_border = $color12
  col.inactive_border = $color10
}

decoration {
  rounding = 10
  rounding_power = 2

  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 4
    render_power = 3

    color = $color11
    color_inactive = $color10
  }

  blur {
    enabled = true
    size = 8
    passes = 3
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

  groupbar {
    col.active = $color0
  }
}
