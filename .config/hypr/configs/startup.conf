# Startup applications
# Wallpaper
exec-once = awww-daemon --format argb
exec-once = sleep 1 && awww img $wallDIR/72GXUW.jpg
exec-once = qs -c overview

# Portal/dbus environment setup
exec-once = dbus-update-activation-environment --systemd --all && systemctl --user import-environment

# Kill and restart portals with correct environment
exec-once = sleep 1 && killall -q xdg-desktop-portal-hyprland xdg-desktop-portal; sleep 1 && /usr/lib/xdg-desktop-portal-hyprland & sleep 2 && /usr/lib/xdg-desktop-portal &

# Polkit
exec-once = $scriptsDir/Polkit.sh

# Apps
exec-once = nm-applet --indicator
exec-once = swaync
exec-once = blueman-applet
exec-once = rog-control-center
exec-once = waybar
exec-once = qs
exec-once = fcitx5 -d

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Idle/Lock
exec-once = hypridle
