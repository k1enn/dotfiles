# foot terminal. Monochrome to match dwl bar + fuzzel.
# Reloads on new window; no rebuild needed.

[main]
font=JetBrainsMono Nerd Font Mono:size=14
pad=8x8

[cursor]
style=beam

[colors]
background=030303
foreground=c2c2c2
selection-background=d3d3d3
selection-foreground=030303
# ponytail: bg/fg + selection only; default ANSI 16 palette kept so program
# output (ls, git, etc.) stays readable. Set the 0-15 keys here if you want
# a fully grayscale palette.
