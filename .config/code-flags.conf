# Native Wayland (VSCode defaults to blurry XWayland under fractional scale)
--ozone-platform=wayland
# Chromium's native fractional-scale path is buggy/blurry on wlroots; disabling
# it makes Chromium render at integer 2x and let the compositor downscale to
# 1.25x -> crisp. See dwl monitor scale 1.25 in config.def.h.
--disable-features=WaylandFractionalScaleV1
# Vietnamese/CJK input method under Wayland
--enable-wayland-ime
