# VSCode Dark Theme for Alacritty
# Based on VS Code Default Dark+ colors

[colors.primary]
background = "#1e1e1e"
foreground = "#cccccc"
dim_foreground = "#858585"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#1e1e1e"
cursor = "#aeafad"

[colors.vi_mode_cursor]
text = "#1e1e1e"
cursor = "#007acc"

[colors.search.matches]
foreground = "#1e1e1e"
background = "#ea5c00"

[colors.search.focused_match]
foreground = "#1e1e1e"
background = "#18a3ff"

[colors.footer_bar]
foreground = "#ffffff"
background = "#007acc"

[colors.hints.start]
foreground = "#1e1e1e"
background = "#cca700"

[colors.hints.end]
foreground = "#1e1e1e"
background = "#858585"

[colors.selection]
text = "#ffffff"
background = "#264f78"

[colors.normal]
black = "#000000"
red = "#cd3131"
green = "#0dbc79"
yellow = "#e5e510"
blue = "#2472c8"
magenta = "#bc3fbc"
cyan = "#11a8cd"
white = "#e5e5e5"

[colors.bright]
black = "#666666"
red = "#f14c4c"
green = "#23d18b"
yellow = "#f5f543"
blue = "#3b8eea"
magenta = "#d670d6"
cyan = "#29b8db"
white = "#e5e5e5"

[[colors.indexed_colors]]
index = 16
color = "#ce9178"

[[colors.indexed_colors]]
index = 17
color = "#b5cea8"
