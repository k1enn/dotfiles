font_family JetBrainsMono Nerd Font
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 0

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background #264f78

# VS Code Default Dark Theme Colors
foreground #cccccc
background #1e1e1e
cursor #aeafad

# Black
color0 #000000
color8 #666666

# Red
color1 #cd3131
color9 #f14c4c

# Green
color2  #0dbc79
color10 #23d18b

# Yellow
color3  #e5e510
color11 #f5f543

# Blue
color4  #2472c8
color12 #3b8eea

# Magenta
color5  #bc3fbc
color13 #d670d6

# Cyan
color6  #11a8cd
color14 #29b8db

# White
color7  #e5e5e5
color15 #e5e5e5

# URL color
url_color #3794ff

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #1e1e1e
inactive_tab_foreground #808080
inactive_tab_background #2d2d2d
tab_bar_background      #252526
